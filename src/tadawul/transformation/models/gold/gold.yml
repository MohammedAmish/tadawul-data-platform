version: 2

models:
  - name: dim_tadawul__companies
    description: >
      Company-centric Gold model containing language-specific Tadawul company
      information. Grain is one row per symbol and language. One-to-many
      company information such as board members, shareholdings, financial
      reports, and financial facts is represented as JSONB arrays.

    columns:
      - name: company_key
        description: >
          Language-specific company identifier composed of the Tadawul symbol
          and language.
        tests:
          - not_null
          - unique

      - name: symbol
        description: Tadawul trading symbol.
        tests:
          - not_null

      - name: language
        description: Language of the Tadawul company page.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['en', 'ar']

      - name: company_id
        description: DLT-generated identifier for the source company record.
        tests:
          - not_null

      - name: company_name
        description: Company name in the page language.
        tests:
          - not_null

      - name: trading_name
        description: Trading name in the page language.
        tests:
          - not_null

      - name: market
        description: Market where the company is listed.

      - name: sector
        description: Tadawul sector associated with the company.

      - name: shares_type
        description: Share type reported by Tadawul.

      - name: foreign_ownership_investors_ownership_percent
        description: >
          Foreign investors' ownership percentage reported by Tadawul.

      - name: foreign_ownership_last_updated
        description: >
          Last update timestamp for foreign ownership information.

      - name: foreign_ownership_maximum_limit_percent
        description: >
          Maximum foreign ownership limit reported by Tadawul.

      - name: foreign_ownership_actual_percent
        description: >
          Actual foreign ownership percentage reported by Tadawul.

      - name: date_established
        description: Company establishment date reported by Tadawul.

      - name: financial_year_end
        description: Company's financial year-end information.

      - name: listing_date
        description: Company listing date reported by Tadawul.

      - name: external_auditors
        description: External auditors reported by Tadawul.

      - name: isin_code
        description: Canonical ISIN code.
        tests:
          - not_null

      - name: number_of_employees
        description: Number of employees reported by Tadawul.

      - name: investor_relations_contact_name
        description: Investor relations contact name reported by Tadawul.

      - name: investor_relations_company_address
        description: Investor relations company address reported by Tadawul.

      - name: investor_relations_company_website
        description: Company website reported by Tadawul.

      - name: email
        description: Investor relations email addresses.

      - name: phone
        description: Investor relations telephone numbers.

      - name: fax
        description: Investor relations fax numbers.

      - name: company_overview
        description: Company overview text in the page language.

      - name: company_history
        description: Company history text in the page language.

      - name: company_bylaws_url
        description: Company bylaws URL reported by Tadawul.

      - name: authorized_capital
        description: Authorized capital reported by Tadawul.

      - name: total_issued_shares
        description: Total issued shares reported by Tadawul.

      - name: paid_up_capital
        description: Paid-up capital reported by Tadawul.

      - name: nominal_value_per_unit
        description: Nominal value per unit reported by Tadawul.

      - name: paid_value_per_unit
        description: Paid value per unit reported by Tadawul.

      - name: subsidiaries
        description: >
          JSONB array containing subsidiary names, ownership percentages,
          business information, locations, and countries.

      - name: board_members
        description: >
          JSONB array containing board members and senior executives with
          their reported management type, roles, classifications, session
          dates, and designations.

      - name: shareholdings
        description: >
          JSONB array containing board shareholding, substantial shareholder,
          and lock-up shareholder observations reported by Tadawul.

      - name: financial_reports
        description: >
          JSONB array containing financial reports with section, period,
          year, publication date, file type, and file URL.

      - name: financials
        description: >
          JSONB array containing financial facts across balance sheet,
          statement of income, and cash flow statements, including the
          statement type, source type, period, metric, and value.

  - name: fct_tadawul__person_company_relationships
    columns:
      - name: person_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tadawul__persons')
                field: person_key

      - name: person_name
        tests:
          - not_null

      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tadawul__companies')
                field: company_key

      - name: symbol
        tests:
          - not_null

      - name: company_name
        tests:
          - not_null

      - name: relationship_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - board_member
                  - board_shareholding
                  - substantial_shareholder