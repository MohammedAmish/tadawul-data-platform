version: 2

models:
  - name: int_tadawul__companies
    columns:
      - name: company_key
        tests:
          - not_null
          - unique

      - name: symbol
        tests:
          - not_null

      - name: language
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['en', 'ar']

  - name: int_tadawul__subsidiaries
    columns:
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tadawul__companies')
                field: company_key

      - name: subsidiary_name
        tests:
          - not_null

  - name: int_tadawul__board_members
    columns:
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tadawul__companies')
                field: company_key

      - name: person_name
        tests:
          - not_null

  - name: int_tadawul__board_shareholdings
