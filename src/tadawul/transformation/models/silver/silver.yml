version: 2

models:

  - name: int_tadawul__companies
    columns:
      - name: company_key
        tests:
          - not_null
          - unique

      - name: symbol
        tests:
          - not_null

      - name: language
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['en', 'ar']

      - name: company_name
        tests:
          - not_null

      - name: market
        tests:
          - not_null

      - name: sector
        tests:
          - not_null

      - name: isin_code
        tests:
          - not_null


  - name: int_tadawul__board_members
    columns:

      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tadawul__companies')
                field: company_key

      - name: person_name
        tests:
          - not_null

      - name: management_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - board_of_directors
                  - senior_executive


  - name: int_tadawul__board_shareholdings
    columns:
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tadawul__companies')
                field: company_key

      - name: shareholder_name
        tests:
          - not_null

      - name: shareholding_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - board_shareholding
                  - substantial_shareholder

      - name: is_lockup
        tests:
          - not_null

      - name: trading_date
        tests:
          - not_null


  - name: int_tadawul__financials
    columns:
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tadawul__companies')
                field: company_key

      - name: symbol
        tests:
          - not_null

      - name: language
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['en', 'ar']

      - name: statement_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - balance_sheet
                  - statement_of_income
                  - cash_flows

      - name: source_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - detailed
                  - financial_information

      - name: period
        tests:
          - not_null

      - name: metric
        tests:
          - not_null


  - name: int_tadawul__financial_reports
    columns:
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_tadawul__companies')
                field: company_key

  - name: int_tadawul__persons
    columns:
      - name: person_key
        tests:
          - not_null
          - unique

      - name: person_name
        tests:
          - not_null